name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    services:
      postgres:
        # pgvector's own image, so CREATE EXTENSION vector works without
        # compiling anything. Matches the version install.sh provisions.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codectx
          POSTGRES_PASSWORD: codectx
          POSTGRES_DB: codectx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codectx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://codectx:codectx@localhost:5432/codectx
      # No API key in CI: the suite falls back to full-text search and the
      # embedding-dependent cases skip themselves rather than failing.
      EMBEDDING_PROVIDER: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Guards the reason install.sh no longer provisions a toolchain: the
      # tree-sitter packages must resolve to a prebuilt binary on linux-x64
      # rather than compiling. If a future bump drops prebuilds, this fails
      # here instead of silently making every user's install slow.
      - name: tree-sitter resolved to a prebuilt binary, not a compile
        run: |
          for pkg in tree-sitter tree-sitter-javascript tree-sitter-typescript tree-sitter-php tree-sitter-python tree-sitter-go; do
            test -f "node_modules/$pkg/prebuilds/linux-x64/$pkg.node" || {
              echo "::error::$pkg has no linux-x64 prebuild; npm install now needs a C toolchain"
              exit 1
            }
          done
          test ! -d node_modules/tree-sitter/build || {
            echo "::error::tree-sitter was compiled from source despite a prebuild being available"
            exit 1
          }

      - name: Apply migrations
        run: node src/cli.js migrate

      - name: Migration ledger is clean
        run: |
          node src/cli.js migrate --status
          # A second run must apply nothing: migrations have to be idempotent.
          output=$(node src/cli.js migrate)
          echo "$output"
          echo "$output" | grep -q "No pending migrations" || {
            echo "::error::re-running migrate applied something; migrations are not idempotent"
            exit 1
          }

      - run: npm test

      - name: MCP stdio smoke test
        run: |
          response=$(printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_projects","arguments":{}}}' \
            | timeout 60 node src/server.js 2>/dev/null)
          echo "$response"
          echo "$response" | grep -q '"serverInfo"' || { echo "::error::server did not complete the handshake"; exit 1; }
          echo "$response" | grep -q '"id":2' || { echo "::error::list_projects returned no result"; exit 1; }

      - name: CLI smoke test
        run: |
          node src/cli.js help | grep -q search_code
          node src/cli.js index_project ci_selftest "$GITHUB_WORKSPACE"
          node src/cli.js search_code ci_selftest "index a project directory" 3
          node src/cli.js get_file_outline ci_selftest src/operations.js

          # Git history rides the same index run. actions/checkout defaults to
          # depth 1, so a shallow clone has exactly one commit -- which is
          # still enough to prove the ingest path and both query surfaces work.
          node src/cli.js history ci_selftest src/indexer.js 5
          node src/cli.js who_owns ci_selftest src/indexer.js 5
          node src/cli.js history ci_selftest | grep -q '"total_commits"'
          # Every symbol the indexer wrote must already carry its identity.
          # If it doesn't, the backfill command has quietly become mandatory
          # for new data instead of being an upgrade path for old data.
          status=$(node src/cli.js backfill-identity ci_selftest --status --json)
          echo "$status"
          node -e '
            const rows = JSON.parse(process.argv[1]);
            const bad = rows.filter((r) => r.unlinked > 0 || r.unkeyed > 0);
            if (bad.length) {
              console.error("::error::indexer left symbols without an entity: " + JSON.stringify(bad));
              process.exit(1);
            }
          ' "$status"

          node src/cli.js delete_project ci_selftest --yes
          # Argument validation must reject out-of-range input, not clamp it.
          if node src/cli.js search_code ci_selftest q 9999 2>/dev/null; then
            echo "::error::CLI accepted an out-of-range limit"; exit 1
          fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Verify the package tarball builds
        run: npm pack --dry-run

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts parse
        run: for f in ./*.sh hooks/*.sh; do bash -n "$f"; done
      # Advisory for now: the existing scripts have never been linted, so this
      # reports findings without failing the build. Flip to blocking once the
      # first run's output has been triaged.
      - uses: ludeeus/action-shellcheck@master
        continue-on-error: true
        with:
          severity: error
          ignore_paths: pgvector
