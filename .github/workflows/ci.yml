name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    services:
      postgres:
        # pgvector's own image, so CREATE EXTENSION vector works without
        # compiling anything. Matches the version install.sh provisions.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codectx
          POSTGRES_PASSWORD: codectx
          POSTGRES_DB: codectx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codectx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://codectx:codectx@localhost:5432/codectx
      # No API key in CI: the suite falls back to full-text search and the
      # embedding-dependent cases skip themselves rather than failing.
      EMBEDDING_PROVIDER: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Guards the reason install.sh no longer provisions a toolchain: the
      # tree-sitter packages must resolve to a prebuilt binary on linux-x64
      # rather than compiling. If a future bump drops prebuilds, this fails
      # here instead of silently making every user's install slow.
      - name: tree-sitter resolved to a prebuilt binary, not a compile
        run: |
          for pkg in tree-sitter tree-sitter-javascript tree-sitter-typescript tree-sitter-php tree-sitter-python tree-sitter-go; do
            test -f "node_modules/$pkg/prebuilds/linux-x64/$pkg.node" || {
              echo "::error::$pkg has no linux-x64 prebuild; npm install now needs a C toolchain"
              exit 1
            }
          done
          test ! -d node_modules/tree-sitter/build || {
            echo "::error::tree-sitter was compiled from source despite a prebuild being available"
            exit 1
          }

      - name: Apply migrations
        run: node src/cli.js migrate

      - name: Migration ledger is clean
        run: |
          node src/cli.js migrate --status
          # A second run must apply nothing: migrations have to be idempotent.
          output=$(node src/cli.js migrate)
          echo "$output"
          echo "$output" | grep -q "No pending migrations" || {
            echo "::error::re-running migrate applied something; migrations are not idempotent"
            exit 1
          }

      - run: npm test

      - name: MCP stdio smoke test
        run: |
          response=$(printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_projects","arguments":{}}}' \
            | timeout 60 node src/server.js 2>/dev/null)
          echo "$response"
          echo "$response" | grep -q '"serverInfo"' || { echo "::error::server did not complete the handshake"; exit 1; }
          echo "$response" | grep -q '"id":2' || { echo "::error::list_projects returned no result"; exit 1; }

      - name: CLI smoke test
        run: |
          node src/cli.js help | grep -q search_code
          node src/cli.js index_project ci_selftest "$GITHUB_WORKSPACE"
          node src/cli.js search_code ci_selftest "index a project directory" 3
          node src/cli.js get_file_outline ci_selftest src/operations.js

          # Git history rides the same index run. actions/checkout defaults to
          # depth 1, so a shallow clone has exactly one commit -- which is
          # still enough to prove the ingest path and both query surfaces work.
          node src/cli.js history ci_selftest src/indexer.js 5
          node src/cli.js who_owns ci_selftest src/indexer.js 5
          node src/cli.js history ci_selftest | grep -q '"total_commits"'
          # Every symbol the indexer wrote must already carry its identity.
          # If it doesn't, the backfill command has quietly become mandatory
          # for new data instead of being an upgrade path for old data.
          status=$(node src/cli.js backfill-identity ci_selftest --status --json)
          echo "$status"
          node -e '
            const rows = JSON.parse(process.argv[1]);
            const bad = rows.filter((r) => r.unlinked > 0 || r.unkeyed > 0);
            if (bad.length) {
              console.error("::error::indexer left symbols without an entity: " + JSON.stringify(bad));
              process.exit(1);
            }
          ' "$status"

          node src/cli.js delete_project ci_selftest --yes
          # Argument validation must reject out-of-range input, not clamp it.
          if node src/cli.js search_code ci_selftest q 9999 2>/dev/null; then
            echo "::error::CLI accepted an out-of-range limit"; exit 1
          fi

      - name: CLI help and error surface
        run: |
          # `x && { exit 1; }` is avoided throughout this step: it reads as an
          # assertion but evaluates to the *grep's* status, so as a step's last
          # line the passing case fails the job. `if ! ...; then` does not.
          #
          # The first thing a new user types. It used to print "Unknown command".
          for flag in --help -h help; do
            if ! out=$(node src/cli.js "$flag"); then
              echo "::error::$flag exited non-zero"; exit 1
            fi
            if ! echo "$out" | grep -q "Getting started:"; then
              echo "::error::$flag did not print the grouped command list"; exit 1
            fi
            if echo "$out" | grep -qi "unknown command"; then
              echo "::error::$flag was treated as an unknown command"; exit 1
            fi
          done
          # Per-command help wraps at 78 columns, so the phrase being matched can
          # straddle a newline -- flatten before grepping.
          node src/cli.js help search_code | tr '\n' ' ' \
            | grep -q "Reciprocal Rank Fusion"
          node src/cli.js help search_code | grep -q "^Usage: waycontext search_code"

          # A domain error must be one readable line, with no stack frames, and
          # must exit non-zero. Both were wrong before: frames, and exit 0.
          set +e
          err=$(node src/cli.js get_symbol no_such_project Foo 2>&1)
          status=$?
          set -e
          echo "$err"
          test "$status" -ne 0 || { echo "::error::a failed command exited 0"; exit 1; }
          if ! echo "$err" | grep -q "Run index_project first"; then
            echo "::error::domain error lost its message"; exit 1
          fi
          if echo "$err" | grep -qE '^[[:space:]]+at '; then
            echo "::error::a stack trace leaked into a domain error"; exit 1
          fi

          # An unreachable database must explain itself rather than printing a
          # pg-pool trace, and must name the URL it tried without its password.
          set +e
          err=$(WAYCONTEXT_IGNORE_DOTENV=1 \
                DATABASE_URL=postgres://u:sup3rs3cret@127.0.0.1:59999/nope \
                node src/cli.js list_projects 2>&1)
          status=$?
          set -e
          echo "$err"
          test "$status" -ne 0
          echo "$err" | grep -q "Can't reach the PostgreSQL database"
          echo "$err" | grep -q "docker compose"
          if echo "$err" | grep -q "sup3rs3cret"; then
            echo "::error::the database password was printed in an error"; exit 1
          fi
          # --debug must still give a maintainer the frames. Captured rather than
          # piped: the command exits non-zero by design, which under `pipefail`
          # would fail the pipeline no matter what grep found.
          set +e
          dbg=$(WAYCONTEXT_IGNORE_DOTENV=1 \
                DATABASE_URL=postgres://u:p@127.0.0.1:59999/nope \
                node src/cli.js list_projects --debug 2>&1)
          set -e
          if ! echo "$dbg" | grep -qE '^[[:space:]]+at '; then
            echo "$dbg"
            echo "::error::--debug did not print a stack trace"; exit 1
          fi

      - name: Indexing an unsupported language says so
        run: |
          mkdir -p /tmp/rustish && echo 'fn main() {}' > /tmp/rustish/main.rs
          node src/cli.js index_project ci_unsupported /tmp/rustish 2>&1 | tee unsup.log
          grep -q "No supported source files found" unsup.log || {
            echo "::error::a repo of unsupported files reported plain success"; exit 1
          }
          node src/cli.js delete_project ci_unsupported --yes

  # install.sh was previously only parsed with `bash -n`, never executed -- which
  # made the very first thing a new user runs the least-tested code in the repo.
  # It provisions its own database via Docker here, so this job takes no service
  # container: the point is to exercise the path a fresh clone actually takes.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fresh-clone install
        run: |
          test ! -f .env    # precondition: this must be the fresh path
          ./install.sh

      - name: install.sh produced a working configuration
        run: |
          test -f .env
          grep -q '^DATABASE_URL=postgres://' .env
          # 600, because it holds a generated credential.
          test "$(stat -c '%a' .env)" = "600"
          # The schema must exist and be fully applied.
          node src/cli.js migrate | grep -q "No pending migrations"
          node src/cli.js list_projects

      - name: Re-running is idempotent
        run: |
          before="$(grep '^DATABASE_URL=' .env)"
          ./install.sh
          after="$(grep '^DATABASE_URL=' .env)"
          test "$before" = "$after" || {
            echo "::error::install.sh rewrote DATABASE_URL on a re-run"; exit 1
          }
          node src/cli.js list_projects

      # A missing `claude` binary must not fail the install: WayContext speaks MCP
      # to any client, and every step that matters has already succeeded by then.
      # There is no `claude` on the runner, so this is the case being exercised
      # above -- assert it explicitly rather than relying on that staying true.
      - name: A missing Claude Code CLI is a warning, not a failure
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo "::notice::claude is on PATH; this job no longer covers its absence"
            exit 0
          fi
          ./install.sh 2>&1 | tee out.log
          grep -qi "skipping automatic MCP registration" out.log
          grep -q "mcpServers" out.log    # prints the config for other clients

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Verify the package tarball builds
        run: npm pack --dry-run

      # The README's documentation table is a list of links into docs/. Shipping
      # the README without them gives npm users a page of dead links.
      - name: The tarball contains the docs the README links to
        run: |
          npm pack >/dev/null 2>&1
          tar tzf waycontext-*.tgz > files.txt
          for f in README.md CHANGELOG.md LICENSE NOTICE SECURITY.md \
                   docs/installation.md docs/troubleshooting.md docs/api.md \
                   src/migrations/0001_baseline.sql; do
            if ! grep -q "^package/$f$" files.txt; then
              echo "::error::$f is missing from the package tarball"; exit 1
            fi
          done
          # The images are deliberately excluded (3.5 MB); the docs reference them
          # by absolute URL so they still resolve.
          if grep -q '^package/src/images/' files.txt; then
            echo "::error::src/images should be excluded from the tarball"; exit 1
          fi

      # The general form of the bug the check above cannot see: `files` in
      # package.json OVERRIDES .gitignore for any path it lists, so adding
      # `docs/` silently started shipping docs/superpowers/** -- ~300 kB of
      # internal planning documents that are gitignored precisely because they
      # aren't for distribution. Listing expected files can't catch that; only
      # asking what ELSE is in there can.
      - name: The tarball ships nothing that isn't tracked in git
        run: |
          tar tzf waycontext-*.tgz | sed 's|^package/||' | grep -v '/$' > shipped.txt
          rc=0
          while read -r f; do
            if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is in the tarball but not tracked in git"
              rc=1
            fi
          done < shipped.txt
          exit $rc

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts parse
        run: for f in ./*.sh hooks/*.sh; do bash -n "$f"; done
      # Still advisory: the scripts have never been linted, so the first run's
      # findings need triaging before this can block. The `install` job above now
      # actually executes install.sh end to end, which covers the failure modes
      # that mattered most (they were runtime bugs -- a GNU-only `sed -i`, a
      # `node` call above the Node check -- not lint findings). Flip `severity` to
      # blocking once the backlog here is at zero.
      - uses: ludeeus/action-shellcheck@master
        continue-on-error: true
        with:
          severity: error
          ignore_paths: pgvector
