<!doctype html>
<!--
  The web knowledge graph.

  One self-contained file: no bundler, no CDN, no framework, no build step. It is
  served by src/http.js and talks to POST /v1/ops/:name, which is the same
  operations registry MCP and the CLI dispatch — so a new operation appears here
  without this file being edited, and nothing about the schema is duplicated.

  The force-directed layout is about 40 lines of Verlet integration at the bottom.
  A graph library would be 200 KB to draw fewer than a hundred nodes.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WayContext — knowledge graph</title>
<style>
  /* Same design language as settings.html and the Decision Review page. */
  :root {
    color-scheme: light;
    --bg: #f0f0f8;
    --bg-2: #e8eaf6;
    --panel: #ffffff;
    --fg: #10143b;
    --muted: #7d91b0;
    --line: #e3e5f0;
    --ink: #354965;
    --accent: #6674ff;
    --accent-soft: #e9ebff;
    --accent-line: #d9ddff;
    --risk: #d1435b;
    --warm: #d48a1e;
    --edge: #c9cde3;
    --shadow: 0 5px 18px rgba(26, 35, 72, .075);
    --radius: 12px;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0d1119;
      --bg-2: #141b28;
      --panel: #151d2b;
      --fg: #edf2fb;
      --muted: #9aa8bd;
      --line: #293548;
      --ink: #dbe5f5;
      --accent: #9291ff;
      --accent-soft: #232a4a;
      --accent-line: #343d6b;
      --risk: #ff7f91;
      --warm: #f0bd67;
      --edge: #34405a;
      --shadow: 0 8px 24px rgba(0, 0, 0, .22);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 "Be Vietnam Pro", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  select, input, button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 38%, transparent);
    outline-offset: 2px;
  }
  select, input[type=search] {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; transition: border-color .16s, box-shadow .16s;
  }
  select:hover, input[type=search]:hover { border-color: var(--accent-line); }
  select:focus, input[type=search]:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  button {
    cursor: pointer; border: 1px solid var(--line); background: var(--bg-2); color: var(--ink);
    border-radius: 10px; padding: 8px 14px; font-size: 12px; font-weight: 700;
    transition: transform .14s ease, background .18s ease, border-color .18s ease, color .18s ease;
  }
  button:hover { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
  button:active { transform: translateY(1px) scale(.98); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { color: #fff; filter: brightness(1.06); }
  code {
    font: 12px/1.45 var(--mono); background: var(--bg-2); color: var(--ink);
    padding: 2px 6px; border-radius: 6px; overflow-wrap: anywhere;
  }
  .muted { color: var(--muted); }
  .err { color: var(--risk); }

  /* --- shell -------------------------------------------------------------- */
  header {
    position: sticky; top: 0; z-index: 30;
    display: flex; gap: 12px 14px; align-items: center; flex-wrap: wrap;
    padding: 14px clamp(16px, 3vw, 34px);
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--panel) 86%, transparent);
    backdrop-filter: blur(18px);
  }
  h1 { margin: 0 10px 0 0; font-size: 16px; line-height: 1.3; letter-spacing: -.035em; font-weight: 760; white-space: nowrap; }
  h1::before {
    content: "W"; display: inline-grid; place-items: center;
    width: 29px; height: 29px; margin-right: 10px; border-radius: 9px;
    color: #fff; font-size: 14px; vertical-align: middle;
    background: linear-gradient(135deg, #7778f6, #4b4dc6);
    box-shadow: 0 5px 14px rgba(91, 92, 226, .24);
  }
  .searchbox { display: flex; gap: 8px; flex: 1; min-width: 240px; max-width: 620px; }
  .searchbox input { flex: 1; min-width: 0; }
  .top-link {
    margin-left: auto; display: inline-flex; align-items: center;
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px;
    font-size: 12px; font-weight: 650; color: var(--ink); background: var(--panel);
  }
  .top-link:hover { color: var(--accent); border-color: var(--accent-line); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: calc(100vh - 66px); }

  /* --- canvas ------------------------------------------------------------- */
  #canvas {
    position: relative; overflow: hidden;
    background:
      radial-gradient(circle, color-mix(in srgb, var(--muted) 22%, transparent) 1px, transparent 1.5px) 0 0 / 22px 22px,
      radial-gradient(ellipse 50% 40% at 50% 45%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 75%);
  }
  svg { width: 100%; height: 100%; display: block; }
  .overlay {
    position: absolute; left: 18px; right: 18px; bottom: 18px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; pointer-events: none;
  }
  .overlay > * {
    pointer-events: auto; border: 1px solid var(--line); border-radius: 10px;
    background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(10px);
    box-shadow: var(--shadow); padding: 7px 12px; font-size: 11px; font-weight: 650;
  }
  #status:empty { display: none; }
  .legend { display: inline-flex; gap: 12px; align-items: center; color: var(--ink); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .node { cursor: pointer; }
  .node circle { stroke: var(--panel); stroke-width: 2.5; transition: stroke .15s, filter .15s; filter: drop-shadow(0 3px 6px rgba(26, 35, 72, .18)); }
  .node .halo { fill: none; stroke: none; filter: none; }
  .node:hover circle:not(.halo), .node.sel circle:not(.halo) { stroke: var(--accent); stroke-width: 3; }
  .node.sel .halo { stroke: color-mix(in srgb, var(--accent) 35%, transparent); stroke-width: 6; }
  .node text {
    font-size: 11px; font-weight: 650; fill: var(--fg); pointer-events: none;
    paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round;
  }
  .edge { stroke: var(--edge); stroke-linecap: round; }

  /* --- inspector ---------------------------------------------------------- */
  aside {
    border-left: 1px solid var(--line);
    background: color-mix(in srgb, var(--panel) 72%, transparent);
    padding: 26px 24px; overflow-y: auto;
  }
  .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--accent); font-size: 10px; text-transform: uppercase;
    letter-spacing: .16em; font-weight: 850; margin-bottom: 10px;
  }
  .panel-title { margin: 0 0 4px; color: var(--fg); text-transform: none; font-size: 20px; line-height: 1.25; letter-spacing: -.035em; font-weight: 780; overflow-wrap: anywhere; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 18px 0 6px; }
  .stat { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 12px; box-shadow: var(--shadow); min-width: 0; }
  .stat .k { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; }
  .stat .v { font-size: 20px; font-weight: 780; letter-spacing: -.04em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  h2 {
    margin: 26px 0 10px; font-size: 10px; text-transform: uppercase;
    letter-spacing: .11em; color: var(--muted); font-weight: 800;
  }
  .box { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 6px 14px; box-shadow: var(--shadow); }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .kv:last-of-type { border-bottom: 0; }
  .kv span:first-child { color: var(--ink); }
  .kv span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 7px; border-radius: 999px; background: var(--bg-2); overflow: hidden; margin: 6px 0 4px; }
  .bar > i { display: block; height: 100%; border-radius: inherit; }
  .basis { font-size: 11px; padding-bottom: 8px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; min-width: 0;
  }
  .list li:last-child { border-bottom: 0; }
  .list li > :first-child { min-width: 0; overflow-wrap: anywhere; }
  .list .n { color: var(--muted); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill {
    display: inline-flex; align-items: center; font-size: 9px; line-height: 1.5;
    padding: 2px 7px; border-radius: 7px; border: 1px solid var(--line); color: var(--muted);
    text-transform: uppercase; letter-spacing: .045em; font-weight: 800; white-space: nowrap;
  }
  .pill.accent { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
  .results { list-style: none; margin: 0; padding: 0; }
  .results li {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
    padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); overflow-wrap: anywhere;
  }
  .results .head { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .results b { font-weight: 700; }
  .results .snip { margin-top: 6px; font-size: 12px; }
  .empty-state { padding: 18px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); padding: 22px 16px; }
    .searchbox { order: 3; max-width: none; flex-basis: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<header>
  <h1>WayContext · Knowledge graph</h1>
  <select id="project" aria-label="Project"></select>
  <div class="searchbox">
    <input id="q" type="search" placeholder="Search code, docs and memory…" autocomplete="off" aria-label="Search">
    <button id="ask" class="primary">Search</button>
  </div>
  <a class="top-link" href="/settings.html">Settings →</a>
</header>
<main>
  <div id="canvas">
    <svg id="svg" role="img" aria-label="Module dependency graph"></svg>
    <div class="overlay">
      <span class="legend"><span><i style="background:var(--accent)"></i>low risk</span><span><i style="background:var(--warm)"></i>medium</span><span><i style="background:var(--risk)"></i>high</span></span>
      <span id="status" class="muted"></span>
    </div>
  </div>
  <aside id="panel"><p class="muted">Loading…</p></aside>
</main>

<script type="module">
// --- the only thing that talks to the server -------------------------------
// Every call goes through the operations registry. There is no endpoint here
// that knows about modules specifically.
async function op(name, args) {
  const res = await fetch(`/v1/ops/${name}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(args),
  });
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || `${name} failed`);
  return body.result;
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[<>&"]/g, (c) =>
  ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
const status = (msg, isErr) => {
  $("status").textContent = msg;
  $("status").className = isErr ? "err" : "muted";
};

let project = null;
let graph = { nodes: [], edges: [] };
let selected = null;

// --- data ------------------------------------------------------------------
async function boot() {
  try {
    const projects = await op("list_projects", {});
    const names = projects.map((p) => p.name ?? p.project).filter(Boolean);
    if (!names.length) {
      $("panel").innerHTML = "<p class='empty-state'>No indexed projects. Run <code>waycontext index &lt;name&gt; &lt;path&gt;</code>.</p>";
      return;
    }
    $("project").innerHTML = names.map((n) => `<option>${esc(n)}</option>`).join("");
    project = names[0];
    await loadModules();
  } catch (e) {
    status(e.message, true);
    $("panel").innerHTML = `<p class="err">${esc(e.message)}</p>`;
  }
}

async function loadModules() {
  status("loading modules…");
  const data = await op("get_modules", { project, limit: 60 });
  if (!data.modules.length) {
    $("panel").innerHTML = "<p class='empty-state'>Nothing derived yet — re-index this project.</p>";
    status("");
    return;
  }

  // Dependencies come from get_module, one call per module. Bounded to the 24
  // largest so a big monorepo doesn't fire 200 requests at page load; the count
  // is shown rather than hidden.
  const top = data.modules.slice(0, 24);
  const details = await Promise.all(top.map((m) => op("get_module", { project, module: m.path })));

  const index = new Map(top.map((m, i) => [m.path, i]));
  graph = {
    nodes: top.map((m, i) => ({
      ...m, i,
      x: 200 + Math.cos((i / top.length) * 6.283) * 160,
      y: 200 + Math.sin((i / top.length) * 6.283) * 160,
      vx: 0, vy: 0,
      detail: details[i],
    })),
    edges: [],
  };
  for (const [i, d] of details.entries()) {
    for (const dep of d.depends_on) {
      const j = index.get(dep.path);
      if (j != null && j !== i) graph.edges.push({ a: i, b: j, weight: Number(dep.edge_count) });
    }
  }

  status(
    `${data.modules.length} modules · risk from ${data.risk_basis.replace(/_/g, " ")}` +
    (data.modules.length > top.length ? ` · showing ${top.length}` : "")
  );
  layout();
  select(0);
}

// --- rendering -------------------------------------------------------------
const svg = $("svg");
const NS = "http://www.w3.org/2000/svg";
const el = (name, attrs) => {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};
const radius = (m) => 8 + Math.sqrt(Number(m.loc ?? 0)) / 6;
const colour = (m) => {
  const r = Number(m.risk ?? 0);
  if (r >= 50) return "var(--risk)";
  if (r >= 20) return "var(--warm)";
  return "var(--accent)";
};

function draw() {
  const w = svg.clientWidth || 800, h = svg.clientHeight || 600;
  svg.innerHTML = "";
  const g = el("g", {});
  for (const e of graph.edges) {
    const a = graph.nodes[e.a], b = graph.nodes[e.b];
    g.appendChild(el("line", {
      class: "edge", x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      "stroke-width": Math.min(4, 0.5 + Math.log2(1 + e.weight)),
    }));
  }
  for (const n of graph.nodes) {
    const group = el("g", { class: `node${n.i === selected ? " sel" : ""}` });
    group.appendChild(el("circle", { class: "halo", cx: n.x, cy: n.y, r: radius(n) + 6 }));
    group.appendChild(el("circle", { cx: n.x, cy: n.y, r: radius(n), fill: colour(n) }));
    const label = el("text", { x: n.x, y: n.y + radius(n) + 14, "text-anchor": "middle" });
    label.textContent = n.name;
    group.appendChild(label);
    group.addEventListener("click", () => select(n.i));
    g.appendChild(group);
  }
  svg.appendChild(g);
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
}

/**
 * Verlet-ish force layout: repulsion between every pair, springs along edges,
 * a weak pull to the centre. Runs a fixed number of iterations rather than
 * animating -- the graph is small enough to settle instantly, and a permanent
 * requestAnimationFrame loop is a battery cost for no benefit.
 */
function layout() {
  const w = svg.clientWidth || 800, h = svg.clientHeight || 600;
  const n = graph.nodes;
  // Keep nodes clear of the legend overlay, whose height grows when it wraps.
  const reserve = (document.querySelector(".overlay")?.offsetHeight ?? 0) + 28;
  for (const node of n) { node.x = w / 2 + (node.x - 200); node.y = h / 2 + (node.y - 200); }

  for (let step = 0; step < 300; step++) {
    for (let i = 0; i < n.length; i++) {
      for (let j = i + 1; j < n.length; j++) {
        let dx = n[j].x - n[i].x, dy = n[j].y - n[i].y;
        let d2 = dx * dx + dy * dy || 0.01;
        const push = 9000 / d2;
        const d = Math.sqrt(d2);
        dx /= d; dy /= d;
        n[i].vx -= dx * push; n[i].vy -= dy * push;
        n[j].vx += dx * push; n[j].vy += dy * push;
      }
    }
    for (const e of graph.edges) {
      const a = n[e.a], b = n[e.b];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.01;
      const pull = (d - 130) * 0.01;
      a.vx += (dx / d) * pull; a.vy += (dy / d) * pull;
      b.vx -= (dx / d) * pull; b.vy -= (dy / d) * pull;
    }
    for (const node of n) {
      node.vx += (w / 2 - node.x) * 0.002;
      node.vy += (h / 2 - node.y) * 0.002;
      node.x += node.vx *= 0.82;
      node.y += node.vy *= 0.82;
      const r = radius(node) + 14;
      // Labels are wider than most nodes; ~3.5px per half-character at 11px.
      const rx = Math.max(r, String(node.name ?? "").length * 3.5 + 6);
      node.x = Math.max(rx, Math.min(w - rx, node.x));
      node.y = Math.max(r + 6, Math.min(h - r - reserve, node.y));
    }
  }
  draw();
}

function select(i) {
  selected = i;
  const n = graph.nodes[i];
  const d = n.detail;
  const m = d.metrics;
  const pct = (v) => `${Math.round((v ?? 0) * 100)}%`;

  const rows = m ? [
    ["Risk", `${m.risk}`],
    [`Commits (${m.window_days}d)`, `${m.commits}`],
    ["Of which fixes", `${m.fix_commits}`],
    ["Churn (lines)", `${m.churn}`],
    ["Defect density", pct(m.defect_density)],
    ["Authors", `${m.authors}`],
  ] : [];

  const list = (items) => `<div class="box"><ul class="list">${items.join("")}</ul></div>`;
  $("panel").innerHTML = `
    <div class="kicker">Module</div>
    <h2 class="panel-title">${esc(n.name)}</h2>
    <code>${esc(d.module.path)}</code>
    <div class="stats">
      <div class="stat"><div class="k">Files</div><div class="v">${esc(d.module.file_count)}</div></div>
      <div class="stat"><div class="k">Lines</div><div class="v">${esc(d.module.loc)}</div></div>
      <div class="stat"><div class="k">Symbols</div><div class="v">${esc(d.module.symbol_count)}</div></div>
    </div>
    ${m ? `<h2>Metrics</h2><div class="box">${rows.map(([k, v]) =>
      `<div class="kv"><span>${k}</span><span>${esc(v)}</span></div>`).join("")}
      <div class="bar"><i style="width:${Math.min(100, m.risk)}%;background:${colour(n)}"></i></div>
      <div class="muted basis">basis: ${esc(m.risk_basis.replace(/_/g, " "))}</div></div>`
      : `<h2>Metrics</h2><p class="empty-state">No metrics — this project has no ingested history.</p>`}
    ${d.owners.length ? `<h2>Who to ask</h2>${list(d.owners.map((o) =>
      `<li><span>${esc(o.display_name || o.canonical_email)}</span><span class="pill accent">${pct(o.share)}</span></li>`))}` : ""}
    ${d.depends_on.length ? `<h2>Depends on</h2>${list(d.depends_on.map((x) =>
      `<li><code>${esc(x.path)}</code><span class="n">${esc(x.edge_count)}</span></li>`))}` : ""}
    ${d.depended_on_by.length ? `<h2>Depended on by</h2>${list(d.depended_on_by.map((x) =>
      `<li><code>${esc(x.path)}</code><span class="n">${esc(x.edge_count)}</span></li>`))}` : ""}
    ${d.bug_clusters.length ? `<h2>Recurring bugs</h2>${list(d.bug_clusters.map((c) =>
      `<li><span>${esc(c.label)}${c.method === "terms" ? ' <span class="muted">· keyword-grouped</span>' : ""}</span><span class="pill">${esc(c.size)}</span></li>`))}` : ""}
    <h2>Largest files</h2>
    ${list(d.largest_files.slice(0, 8).map((f) =>
      `<li><code>${esc(f.path)}</code><span class="n">${esc(f.loc ?? 0)}</span></li>`))}
  `;
  draw();
}

// --- search ----------------------------------------------------------------
async function search() {
  const q = $("q").value.trim();
  if (!q) return;
  status("searching…");
  try {
    const rows = await op("search_knowledge", { project, query: q, limit: 12 });
    $("panel").innerHTML = `
      <div class="kicker">Search</div>
      <h2 class="panel-title">“${esc(q)}”</h2>
      <p class="muted" style="margin:0 0 18px">${rows.length} result${rows.length === 1 ? "" : "s"}</p>
      ${rows.length ? `<ul class="results">${rows.map((r) => `
        <li>
          <div class="head"><b>${esc(r.title ?? r.name ?? "(untitled)")}</b><span class="pill accent">${esc(r.type)}</span></div>
          <code>${esc(r.path ?? "")}${r.heading_path ? "#" + esc(r.heading_path) : ""}</code>
          ${r.snippet ? `<div class="muted snip">${esc(String(r.snippet).slice(0, 220))}…</div>` : ""}
        </li>`).join("")}</ul>` : `<p class="empty-state">Nothing found.</p>`}
      <p><button id="back">← Back to modules</button></p>`;
    $("back")?.addEventListener("click", () => select(selected ?? 0));
    status(`${rows.length} result(s)`);
  } catch (e) {
    status(e.message, true);
  }
}

$("ask").addEventListener("click", search);
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
$("project").addEventListener("change", (e) => {
  project = e.target.value;
  loadModules().catch((err) => status(err.message, true));
});
addEventListener("resize", () => { if (graph.nodes.length) layout(); });

boot();
</script>
</body>
</html>
