<!doctype html>
<!--
  The web knowledge graph.

  One self-contained file: no bundler, no CDN, no framework, no build step. It is
  served by src/http.js and talks to POST /v1/ops/:name, which is the same
  operations registry MCP and the CLI dispatch — so a new operation appears here
  without this file being edited, and nothing about the schema is duplicated.

  The force-directed layout is about 40 lines of Verlet integration at the bottom.
  A graph library would be 200 KB to draw fewer than a hundred nodes.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WayContext — knowledge graph</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfd; --fg: #17181c; --muted: #6b6f76; --line: #dfe1e6;
    --panel: #fff; --accent: #2f6fed; --risk: #d1453b; --warm: #e0873a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171b; --fg: #e9eaee; --muted: #9297a1; --line: #2c2e35;
      --panel: #1e2025; --accent: #6c9bff; --risk: #f0685c; --warm: #edab6a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 650; letter-spacing: -0.01em; }
  select, input, button {
    font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  input[type=search] { min-width: 260px; flex: 1; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: calc(100vh - 54px); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; } }
  #canvas { position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; }
  aside {
    border-left: 1px solid var(--line); background: var(--panel);
    padding: 14px 16px; overflow-y: auto;
  }
  @media (max-width: 820px) { aside { border-left: 0; border-top: 1px solid var(--line); } }
  .node { cursor: pointer; }
  .node circle { stroke: var(--panel); stroke-width: 2; transition: stroke .15s; }
  .node:hover circle, .node.sel circle { stroke: var(--accent); stroke-width: 3; }
  .node text { font-size: 11px; fill: var(--fg); pointer-events: none; }
  .edge { stroke: var(--line); }
  h2 { font-size: 13px; margin: 18px 0 6px; text-transform: uppercase;
       letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  h2:first-child { margin-top: 0; }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .kv span:last-child { font-variant-numeric: tabular-nums; }
  ul { margin: 4px 0; padding-left: 18px; }
  li { margin: 2px 0; }
  code { font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
         background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  .muted { color: var(--muted); }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 999px;
          font-size: 11px; border: 1px solid var(--line); }
  .bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .err { color: var(--risk); }
  .results { list-style: none; padding: 0; }
  .results li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .results b { font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>WayContext</h1>
  <select id="project"></select>
  <input id="q" type="search" placeholder="Search code, docs and memory…" autocomplete="off">
  <button id="ask">Search</button>
  <span id="status" class="muted"></span>
</header>
<main>
  <div id="canvas"><svg id="svg"></svg></div>
  <aside id="panel"><p class="muted">Loading…</p></aside>
</main>

<script type="module">
// --- the only thing that talks to the server -------------------------------
// Every call goes through the operations registry. There is no endpoint here
// that knows about modules specifically.
async function op(name, args) {
  const res = await fetch(`/v1/ops/${name}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(args),
  });
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || `${name} failed`);
  return body.result;
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[<>&"]/g, (c) =>
  ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
const status = (msg, isErr) => {
  $("status").textContent = msg;
  $("status").className = isErr ? "err" : "muted";
};

let project = null;
let graph = { nodes: [], edges: [] };
let selected = null;

// --- data ------------------------------------------------------------------
async function boot() {
  try {
    const projects = await op("list_projects", {});
    const names = projects.map((p) => p.name ?? p.project).filter(Boolean);
    if (!names.length) {
      $("panel").innerHTML = "<p class='muted'>No indexed projects. Run <code>waycontext index &lt;name&gt; &lt;path&gt;</code>.</p>";
      return;
    }
    $("project").innerHTML = names.map((n) => `<option>${esc(n)}</option>`).join("");
    project = names[0];
    await loadModules();
  } catch (e) {
    status(e.message, true);
    $("panel").innerHTML = `<p class="err">${esc(e.message)}</p>`;
  }
}

async function loadModules() {
  status("loading modules…");
  const data = await op("get_modules", { project, limit: 60 });
  if (!data.modules.length) {
    $("panel").innerHTML = "<p class='muted'>Nothing derived yet — re-index this project.</p>";
    status("");
    return;
  }

  // Dependencies come from get_module, one call per module. Bounded to the 24
  // largest so a big monorepo doesn't fire 200 requests at page load; the count
  // is shown rather than hidden.
  const top = data.modules.slice(0, 24);
  const details = await Promise.all(top.map((m) => op("get_module", { project, module: m.path })));

  const index = new Map(top.map((m, i) => [m.path, i]));
  graph = {
    nodes: top.map((m, i) => ({
      ...m, i,
      x: 200 + Math.cos((i / top.length) * 6.283) * 160,
      y: 200 + Math.sin((i / top.length) * 6.283) * 160,
      vx: 0, vy: 0,
      detail: details[i],
    })),
    edges: [],
  };
  for (const [i, d] of details.entries()) {
    for (const dep of d.depends_on) {
      const j = index.get(dep.path);
      if (j != null && j !== i) graph.edges.push({ a: i, b: j, weight: Number(dep.edge_count) });
    }
  }

  status(
    `${data.modules.length} modules · risk from ${data.risk_basis.replace(/_/g, " ")}` +
    (data.modules.length > top.length ? ` · showing ${top.length}` : "")
  );
  layout();
  select(0);
}

// --- rendering -------------------------------------------------------------
const svg = $("svg");
const NS = "http://www.w3.org/2000/svg";
const el = (name, attrs) => {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};
const radius = (m) => 8 + Math.sqrt(Number(m.loc ?? 0)) / 6;
const colour = (m) => {
  const r = Number(m.risk ?? 0);
  if (r >= 50) return "var(--risk)";
  if (r >= 20) return "var(--warm)";
  return "var(--accent)";
};

function draw() {
  const w = svg.clientWidth || 800, h = svg.clientHeight || 600;
  svg.innerHTML = "";
  const g = el("g", {});
  for (const e of graph.edges) {
    const a = graph.nodes[e.a], b = graph.nodes[e.b];
    g.appendChild(el("line", {
      class: "edge", x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      "stroke-width": Math.min(4, 0.5 + Math.log2(1 + e.weight)),
    }));
  }
  for (const n of graph.nodes) {
    const group = el("g", { class: `node${n.i === selected ? " sel" : ""}` });
    group.appendChild(el("circle", { cx: n.x, cy: n.y, r: radius(n), fill: colour(n) }));
    const label = el("text", { x: n.x, y: n.y + radius(n) + 12, "text-anchor": "middle" });
    label.textContent = n.name;
    group.appendChild(label);
    group.addEventListener("click", () => select(n.i));
    g.appendChild(group);
  }
  svg.appendChild(g);
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
}

/**
 * Verlet-ish force layout: repulsion between every pair, springs along edges,
 * a weak pull to the centre. Runs a fixed number of iterations rather than
 * animating -- the graph is small enough to settle instantly, and a permanent
 * requestAnimationFrame loop is a battery cost for no benefit.
 */
function layout() {
  const w = svg.clientWidth || 800, h = svg.clientHeight || 600;
  const n = graph.nodes;
  for (const node of n) { node.x = w / 2 + (node.x - 200); node.y = h / 2 + (node.y - 200); }

  for (let step = 0; step < 300; step++) {
    for (let i = 0; i < n.length; i++) {
      for (let j = i + 1; j < n.length; j++) {
        let dx = n[j].x - n[i].x, dy = n[j].y - n[i].y;
        let d2 = dx * dx + dy * dy || 0.01;
        const push = 9000 / d2;
        const d = Math.sqrt(d2);
        dx /= d; dy /= d;
        n[i].vx -= dx * push; n[i].vy -= dy * push;
        n[j].vx += dx * push; n[j].vy += dy * push;
      }
    }
    for (const e of graph.edges) {
      const a = n[e.a], b = n[e.b];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.01;
      const pull = (d - 130) * 0.01;
      a.vx += (dx / d) * pull; a.vy += (dy / d) * pull;
      b.vx -= (dx / d) * pull; b.vy -= (dy / d) * pull;
    }
    for (const node of n) {
      node.vx += (w / 2 - node.x) * 0.002;
      node.vy += (h / 2 - node.y) * 0.002;
      node.x += node.vx *= 0.82;
      node.y += node.vy *= 0.82;
      const r = radius(node) + 14;
      node.x = Math.max(r, Math.min(w - r, node.x));
      node.y = Math.max(r + 6, Math.min(h - r - 14, node.y));
    }
  }
  draw();
}

function select(i) {
  selected = i;
  const n = graph.nodes[i];
  const d = n.detail;
  const m = d.metrics;
  const pct = (v) => `${Math.round((v ?? 0) * 100)}%`;

  const rows = m ? [
    ["Risk", `${m.risk}`],
    [`Commits (${m.window_days}d)`, `${m.commits}`],
    ["Of which fixes", `${m.fix_commits}`],
    ["Churn (lines)", `${m.churn}`],
    ["Defect density", pct(m.defect_density)],
    ["Authors", `${m.authors}`],
  ] : [];

  $("panel").innerHTML = `
    <h2>Module</h2>
    <div><code>${esc(d.module.path)}</code></div>
    <div class="muted">${d.module.file_count} files · ${d.module.loc} lines · ${d.module.symbol_count} symbols</div>
    ${m ? `<h2>Metrics</h2>${rows.map(([k, v]) =>
      `<div class="kv"><span>${k}</span><span>${esc(v)}</span></div>`).join("")}
      <div class="bar" style="margin-top:6px"><i style="width:${Math.min(100, m.risk)}%;background:${colour(n)}"></i></div>
      <div class="muted" style="margin-top:4px">basis: ${esc(m.risk_basis.replace(/_/g, " "))}</div>`
      : `<p class="muted">No metrics — this project has no ingested history.</p>`}
    ${d.owners.length ? `<h2>Who to ask</h2><ul>${d.owners.map((o) =>
      `<li>${esc(o.display_name || o.canonical_email)} <span class="pill">${pct(o.share)}</span></li>`).join("")}</ul>` : ""}
    ${d.depends_on.length ? `<h2>Depends on</h2><ul>${d.depends_on.map((x) =>
      `<li><code>${esc(x.path)}</code> <span class="muted">${x.edge_count}</span></li>`).join("")}</ul>` : ""}
    ${d.depended_on_by.length ? `<h2>Depended on by</h2><ul>${d.depended_on_by.map((x) =>
      `<li><code>${esc(x.path)}</code> <span class="muted">${x.edge_count}</span></li>`).join("")}</ul>` : ""}
    ${d.bug_clusters.length ? `<h2>Recurring bugs</h2><ul>${d.bug_clusters.map((c) =>
      `<li>${esc(c.label)} <span class="pill">${c.size}</span>${c.method === "terms" ? ' <span class="muted">keyword-grouped</span>' : ""}</li>`).join("")}</ul>` : ""}
    <h2>Largest files</h2>
    <ul>${d.largest_files.slice(0, 8).map((f) =>
      `<li><code>${esc(f.path)}</code> <span class="muted">${f.loc ?? 0}</span></li>`).join("")}</ul>
  `;
  draw();
}

// --- search ----------------------------------------------------------------
async function search() {
  const q = $("q").value.trim();
  if (!q) return;
  status("searching…");
  try {
    const rows = await op("search_knowledge", { project, query: q, limit: 12 });
    $("panel").innerHTML = `
      <h2>Results for “${esc(q)}”</h2>
      <ul class="results">${rows.map((r) => `
        <li>
          <b>${esc(r.title ?? r.name ?? "(untitled)")}</b>
          <span class="pill">${esc(r.type)}</span><br>
          <code>${esc(r.path ?? "")}${r.heading_path ? "#" + esc(r.heading_path) : ""}</code>
          ${r.snippet ? `<div class="muted">${esc(String(r.snippet).slice(0, 220))}…</div>` : ""}
        </li>`).join("") || "<li class='muted'>Nothing found.</li>"}</ul>
      <p><button id="back">← Back to modules</button></p>`;
    $("back")?.addEventListener("click", () => select(selected ?? 0));
    status(`${rows.length} result(s)`);
  } catch (e) {
    status(e.message, true);
  }
}

$("ask").addEventListener("click", search);
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
$("project").addEventListener("change", (e) => {
  project = e.target.value;
  loadModules().catch((err) => status(err.message, true));
});
addEventListener("resize", () => { if (graph.nodes.length) layout(); });

boot();
</script>
</body>
</html>
